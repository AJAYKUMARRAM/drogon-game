<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON RUSH</title><style>body{margin:0;overflow:hidden;background:#02040a;color:white;font-family:Arial}#g{position:fixed;inset:0}#menu,#fin{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#02040acc;z-index:5}h1{font-size:clamp(50px,10vw,110px);letter-spacing:.12em;text-shadow:0 0 25px #00e5ff,0 0 60px #f08}button{background:#08121ecc;border:1px solid #00e5ff;color:#fff;padding:15px 50px;margin:8px;font-weight:bold;letter-spacing:.15em}.hide{display:none!important}.hud{position:fixed;inset:0;pointer-events:none}.s{position:absolute;background:#050a12aa;padding:10px;border-left:3px solid #0df}.a{top:18px;left:18px}.b{top:18px;right:18px}.c{top:65px;left:18px}.d{top:65px;right:18px}.n{right:18px;bottom:20px;width:200px}.bar{height:10px;background:#18202b}.fill{height:100%;background:linear-gradient(90deg,#0df,#f0f)}.msg{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:38px;font-weight:900;text-shadow:0 0 18px #0df}.mini{position:absolute;left:18px;bottom:18px;width:170px;height:110px;background:#050a12aa;border:1px solid #ffffff55}</style></head><body><div id="g"></div><div id="menu"><h1>NEON RUSH</h1><button id="play">PLAY</button><button id="garage">GARAGE</button><div>WASD / ARROWS · SPACE NITRO · SHIFT DRIFT</div></div><div id="fin" class="hide"><h1>FINISH</h1><div id="res"></div><button id="again">RACE AGAIN</button><button id="home">MAIN MENU</button></div><div id="hud" class="hud hide"><div class="s a">POSITION <b id="pos">9 / 9</b></div><div class="s b">SPEED <b id="spd">0</b> KM/H</div><div class="s c">SCORE <b id="sc">0</b></div><div class="s d">LAP <b id="lap">1 / 3</b></div><div class="s n">NITRO<div class="bar"><div id="nf" class="fill" style="width:100%"></div></div></div><div id="msg" class="msg"></div><canvas id="mini" class="mini" width="170" height="110"></canvas></div><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';const $=x=>document.querySelector(x);let S,C,R,K,P,O=[],track=[],v=0,n=100,score=0,t=0,lap=1,run=0,sel=0,st=0,top=0,ds=0,shake=0;const specs=[{c:0x00d8ff,a:1,top:1},{c:0xff1b8d,a:1.15,top:.93},{c:0xffa51f,a:.9,top:1.12}];const M=c=>new T.MeshStandardMaterial({color:c,metalness:.65,roughness:.3});function car(c){let g=new T.Group(),b=new T.Mesh(new T.BoxGeometry(2,.55,4.2),M(c));b.position.y=.65;g.add(b);let w=[];for(let x of[-.98,.98])for(let z of[-1.42,1.42]){let q=new T.Mesh(new T.CylinderGeometry(.38,.38,.24,14),M(0x08090c));q.rotation.z=Math.PI/2;q.position.set(x,.4,z);g.add(q);w.push(q)}g.userData.w=w;let cab=new T.Mesh(new T.BoxGeometry(1.5,.6,1.8),M(0x07101c));cab.position.set(0,1.05,-.3);g.add(cab);for(let x of[-.62,.62]){let h=new T.Mesh(new T.BoxGeometry(.3,.12,.08),M(0xffffff));h.position.set(x,.73,2.12);g.add(h);let q=new T.Mesh(new T.BoxGeometry(.32,.12,.08),M(0xff0038));q.position.set(x,.73,-2.12);g.add(q)}return g}function pt(x){let a=x*Math.PI*2;return new T.Vector3(Math.sin(a)*38+Math.sin(a*2)*8,Math.sin(a*3)*2.5,Math.cos(a)*38+Math.cos(a*2)*8)}function world(){S=new T.Scene();S.background=new T.Color(0x02050c);S.fog=new T.FogExp2(0x07101d,.019);C=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.6));$('#g').innerHTML='';$('#g').appendChild(R.domElement);S.add(new T.HemisphereLight(0x7199ff,0x050507,1.2));let L=new T.DirectionalLight(0x9bc7ff,2);L.position.set(30,60,20);S.add(L);let G=new T.Mesh(new T.PlaneGeometry(400,400),M(0x05070a));G.rotation.x=-Math.PI/2;G.position.y=-1;S.add(G);track=[];for(let i=0;i<260;i++){let p=pt(i/260),d=pt((i+1)/260).sub(p),q=new T.Mesh(new T.BoxGeometry(11,.18,d.length()+.2),M(0x101318));q.position.copy(p);q.rotation.y=Math.atan2(d.x,d.z);S.add(q);track.push(p)}for(let i=0;i<130;i++){let p=pt(i/130),d=pt(i/130+.002).sub(p).normalize(),side=i%2?1:-1,q=new T.Mesh(new T.CylinderGeometry(.05,.08,5,7),M(0x20242a));q.position.copy(p).add(new T.Vector3(-d.z*side*6,2.5,d.x*side*6));S.add(q);let l=new T.PointLight(i%3?0x00aaff:0xff168e,2.5,12);l.position.copy(q.position).add(new T.Vector3(0,2.5,0));S.add(l)}for(let i=0;i<120;i++){let x=Math.random(),p=pt(x),a=x*Math.PI*2,side=Math.random()<.5?-1:1,q=new T.Mesh(new T.BoxGeometry(5+Math.random()*5,8+Math.random()*20,5+Math.random()*7),M(0x101827));q.position.copy(p).add(new T.Vector3(Math.cos(a)*side*(10+Math.random()*12),4,Math.sin(a)*side*(10+Math.random()*12)));S.add(q)}}function reset(){world();P=car(specs[sel].c);S.add(P);P.position.copy(pt(0));P.position.y=.25;O=[];for(let i=0;i<8;i++){let q=car([0xff3030,0x5c4dff,0x36ff7c,0xffdd33,0xffffff,0x9b59ff,0xff6b00,0x4de0e0][i]);q.userData={p:-.02-i*.012-off(i),off:(i%4-1.5)*2.7,v:.55+Math.random()*.25};S.add(q);O.push(q)}v=0;n=100;score=0;t=0;lap=1;top=0;ds=0;C.position.copy(P.position).add(new T.Vector3(0,4,-9));C.lookAt(P.position);$('#hud').classList.remove('hide')}function off(i){return Math.random()*.08}function start(){reset();$('#menu').classList.add('hide');$('#fin').classList.add('hide');let x=3,z=setInterval(()=>{$('#msg').textContent=x--;if(x<0){clearInterval(z);$('#msg').textContent='GO!';run=1;st=performance.now();setTimeout(()=>$('#msg').textContent='',600)}},700)}function frame(dt){if(run){let up=K?.u,br=K?.b,le=K?.l,ri=K?.r,dr=K?.d,bo=K?.n;if(bo&&n>0){n-=32*dt;v+=40*dt}v+=(up?42*specs[sel].a:-5)*dt;if(br)v-=25*dt;v=Math.max(0,Math.min(78*specs[sel].top,v));top=Math.max(top,v);let p=pt(t),d=pt(t+.002).sub(p).normalize(),r=new T.Vector3(d.z,0,-d.x),o=P.position.clone().sub(p).dot(r);o+=((le?-1:0)+(ri?1:0))*(dr?7:10)*dt;P.position.lerp(p.clone().add(r.multiplyScalar(o*.94)),dt*8);P.rotation.y=Math.atan2(d.x,d.z)+((le?-1:0)+(ri?1:0))*.13;P.rotation.z=-((le?-1:0)+(ri?1:0))*.08;P.userData.w.forEach(q=>q.rotation.x-=v*dt*2.2);t=(t+v*dt/900)%1;for(let q of O){q.userData.p=(q.userData.p+q.userData.v*dt/900)%1;let p2=pt(q.userData.p),d2=pt(q.userData.p+.002).sub(p2).normalize(),r2=new T.Vector3(d2.z,0,-d2.x);q.position.copy(p2).add(r2.multiplyScalar(q.userData.off));q.position.y=.25;q.rotation.y=Math.atan2(d2.x,d2.z);if(q.position.distanceTo(P.position)<2.1){v*=.7;shake=.3}}if(t<.003&&v>5){lap++;if(lap>3)return finish()};score+=Math.floor(v*dt*(bo?3:1));if(dr&&v>25)ds+=v*dt;$('#spd').textContent=Math.floor(v*3.6);$('#sc').textContent=Math.floor(score);$('#lap').textContent=Math.min(lap,3)+' / 3';$('#nf').style.width=n+'%';$('#pos').textContent=(O.filter(q=>q.userData.p<t).length+1)+' / 9';let cp=P.position.clone().add(d.clone().multiplyScalar(-9)).add(new T.Vector3(0,3.5,0));C.position.lerp(cp,dt*5);C.lookAt(P.position.clone().add(new T.Vector3(0,1,2)));C.fov=65+(bo?12:0);C.updateProjectionMatrix();shake=Math.max(0,shake-dt);if(shake)C.position.add(new T.Vector3((Math.random()-.5)*shake,(Math.random()-.5)*shake,0));R.render(S,C)}}function finish(){run=0;$('#hud').classList.add('hide');$('#fin').classList.remove('hide');$('#res').innerHTML='POSITION <b>'+$('#pos').textContent+'</b><br>TIME <b>'+((performance.now()-st)/1000).toFixed(2)+'s</b><br>SCORE <b>'+score+'</b><br>TOP SPEED <b>'+Math.floor(top*3.6)+' KM/H</b><br>DRIFT SCORE <b>'+Math.floor(ds)+'</b>'}K={};addEventListener('keydown',e=>{K[e.key==='ArrowUp'||e.key==='w'?'u':e.key==='ArrowDown'||e.key==='s'?'b':e.key==='ArrowLeft'||e.key==='a'?'l':e.key==='ArrowRight'||e.key==='d'?'r':e.key==='Shift'?'d':e.key===' '?'n':e.key]=1});addEventListener('keyup',e=>{delete K[e.key==='ArrowUp'||e.key==='w'?'u':e.key==='ArrowDown'||e.key==='s'?'b':e.key==='ArrowLeft'||e.key==='a'?'l':e.key==='ArrowRight'||e.key==='d'?'r':e.key==='Shift'?'d':e.key===' '?'n':e.key]});$('#play').onclick=start;$('#again').onclick=start;$('#home').onclick=()=>{$('#fin').classList.add('hide');$('#menu').classList.remove('hide');world()};world();let last=performance.now();(function loop(now){requestAnimationFrame(loop);let dt=Math.min(.033,(now-last)/1000);last=now;frame(dt)})();</script></body></html>
